* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

.sub { color: var(--text-secondary); margin: 0 0 16px; }

.sw { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 8px; position: relative; }
.card h2 { font-size: 15px; margin: 0 0 2px; }
.card .now { color: var(--text-secondary); font-size: 13px; margin: 0 0 6px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);

.tip b { display: block; margin-bottom: 2px; }
.tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
details { margin-top: 24px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
summary { cursor: pointer; color: var(--text-secondary); }
.tw { overflow-x: auto; }
table { border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 600; }
</style>

"date": "2026-10-18", "source": "imot.bg", "deal": "rent", "district": "Сточна гара", "category": "магазин", "count": 0}, {"date": "2026-10-18", "source": "imot.bg", "deal": "sale", "district": "Център", "category": "двустаен", "count": 349}, {"date": "2026-10-18", "source": "imot.bg", "deal": "sale", "district": "Сточна гара", "category": "двустаен", "count": 2}, {"date": "2026-10-18", "source": "imot.bg", "deal": "sale", "district": "Център", "category": "тристаен", "count": 589}, {"date": "2026-10-18", "source": "imot.bg", "deal": "sale", "district": "Сточна гара", "category": "тристаен", "count": 2}, {"date": "2026-10-18", "source": "imot.bg", "deal": "sale", "district": "Център", "category": "мезонет", "count": 40}, {"date": "2026-10-18", "source": "imot.bg", "deal": "sale", "district": "Сточна гара", "category": "мезонет", "count": 0}];
const NS = "http://www.w3.org/2000/svg";

// Each section: a legend + panels; each panel: lines identified by (deal, district, category).
const S_SALE = { lbl: "Продажба", color: "--series-1" }, S_RENT = { lbl: "Наем", color: "--series-2" };
const SECTIONS = [
  { title: "Офиси и магазини", legend: [S_SALE, S_RENT], panels: [
    ["Офиси · Център", "Център", "офис"], ["Магазини · Център", "Център", "магазин"],
    ["Офиси · Сточна гара", "Сточна гара", "офис"], ["Магазини · Сточна гара", "Сточна гара", "магазин"],
  ].map(([title, dist, cat]) => ({ title, series: [
    { ...S_SALE, deal: "sale", dist, cat }, { ...S_RENT, deal: "rent", dist, cat } ] })) },
  { title: "Жилища за продажба", legend: [
      { lbl: "Двустайни", color: "--series-3" }, { lbl: "Тристайни", color: "--series-4" }, { lbl: "Мезонети", color: "--series-5" } ],
    panels: ["Център", "Сточна гара"].map(dist => ({ title: `Продажба · ${dist}`, series: [
      { lbl: "Двустайни", color: "--series-3", deal: "sale", dist, cat: "двустаен" },
      { lbl: "Тристайни", color: "--series-4", deal: "sale", dist, cat: "тристаен" },
      { lbl: "Мезонети", color: "--series-5", deal: "sale", dist, cat: "мезонет" } ] })) },
];

const recorded = [...new Set(ROWS.map(r => r.date))].sort();
// every calendar day from the first to the last record, so missing days show as gaps
const dates = [];
if (recorded.length)
  for (let t = Date.parse(recorded[0] + "T00:00:00Z"); t <= Date.parse(recorded[recorded.length - 1] + "T00:00:00Z"); t += 864e5)
    dates.push(new Date(t).toISOString().slice(0, 10));
const val = {};
for (const r of ROWS) val[[r.date, r.deal, r.district, r.category].join("|")] = +r.count;
const get = (d, s) => val[[d, s.deal, s.dist, s.cat].join("|")];

const fmtDate = d => { const [y, m, dd] = d.split("-"); return `${dd}.${m}.${y}`; };
const fmtShort = d => { const [, m, dd] = d.split("-"); return `${dd}.${m}`; };
document.getElementById("sub").textContent = dates.length
  ? `Източник: imot.bg · ${fmtDate(dates[0])} – ${fmtDate(dates[dates.length - 1])} · ${recorded.length} ${recorded.length === 1 ? "ден" : "дни"} с данни` +
    (dates.length > recorded.length ? ` · липсват: ${dates.filter(d => !recorded.includes(d)).map(fmtShort).join(", ")}` : "")
  : "Още няма данни.";

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// Smallest whole-number tick step that fits v in at most 5 ticks.
function niceScale(v) {
  if (v <= 4) return { max: 4, step: 1 };
  for (let p = 1; ; p *= 10)
    for (const m of [1, 2, 2.5, 5]) {
      const step = m * p;
      if (Number.isInteger(step) && Math.ceil(v / step) <= 5) return { max: Math.ceil(v / step) * step, step };
    }
}

const W = 480, H = 250, M = { l: 36, r: 92, t: 12, b: 26 };
const iw = W - M.l - M.r, ih = H - M.t - M.b;
const x = i => M.l + (dates.length === 1 ? iw / 2 : (i / (dates.length - 1)) * iw);

function drawPanel(grid, { title, series }) {
  const card = document.createElement("div");
  card.className = "card";
  const latest = dates[dates.length - 1];
  const nowTxt = series.map(s => `${s.lbl}: ${get(latest, s) ?? "–"}`).join(" · ");
  card.innerHTML = `<h2>${title}</h2><p class="now">Последно (${latest ? fmtDate(latest) : "–"}): ${nowTxt}</p>`;
  grid.appendChild(card);

  let max = 0;
  for (const d of dates) for (const s of series) { const v = get(d, s); if (v != null) max = Math.max(max, v); }
  const { max: ymax, step: ystep } = niceScale(max * 1.05);
  const y = v => M.t + ih - (v / ymax) * ih;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title }, card);
  for (let i = 0; i * ystep <= ymax; i++) {
    const v = i * ystep, yy = y(v);
    el("line", { x1: M.l, x2: M.l + iw, y1: yy, y2: yy, stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }, svg);
    const t = el("text", { x: M.l - 8, y: yy + 4, "text-anchor": "end", "font-size": 12, fill: "var(--text-muted)" }, svg);
    t.textContent = v;
  }
  const step = Math.max(1, Math.ceil(dates.length / 6));
  dates.forEach((d, i) => {
    if (i % step && i !== dates.length - 1) return;
    const t = el("text", { x: x(i), y: H - 6, "text-anchor": "middle", "font-size": 12, fill: "var(--text-muted)" }, svg);
    t.textContent = fmtShort(d);
  });

  const ends = [];
  for (const s of series) {
    const pts = dates.map((d, i) => [i, get(d, s)]).filter(p => p[1] != null);
    if (!pts.length) continue;
    if (pts.length > 1)
      el("path", { d: pts.map((p, j) => `${j && p[0] - pts[j - 1][0] === 1 ? "L" : "M"}${x(p[0])},${y(p[1])}`).join(""), fill: "none",
        stroke: `var(${s.color})`, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    if (pts.length <= 31)
      for (const p of pts) el("circle", { cx: x(p[0]), cy: y(p[1]), r: 4, fill: `var(${s.color})`, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    const last = pts[pts.length - 1];
    ends.push({ y: y(last[1]), x: x(last[0]), lbl: s.lbl, v: last[1] });
  }
  // direct labels at line ends, nudged apart if they collide
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  // keep labels above the date axis: push the stack back up from the baseline
  for (let i = ends.length - 1; i >= 0; i--)
    ends[i].y = Math.min(ends[i].y, i === ends.length - 1 ? M.t + ih : ends[i + 1].y - 14);
  for (const e of ends) {
    const t = el("text", { x: e.x + 8, y: e.y + 4, "font-size": 12, fill: "var(--text-secondary)" }, svg);
    t.textContent = `${e.lbl} ${e.v}`;
  }

  // hover: crosshair + tooltip
  const cross = el("line", { y1: M.t, y2: M.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" }, svg);
  const tip = document.createElement("div"); tip.className = "tip"; card.appendChild(tip);
  const hit = el("rect", { x: M.l - 10, y: M.t, width: iw + 20, height: ih, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    let i = dates.length === 1 ? 0 : Math.round((sx - M.l) / iw * (dates.length - 1));
    i = Math.max(0, Math.min(dates.length - 1, i));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${fmtDate(dates[i])}</b>` + series.map(s =>
      `<div><i style="background:var(${s.color})"></i>${s.lbl}: ${get(dates[i], s) ?? "–"}</div>`).join("");
    tip.style.display = "block";
    const cr = card.getBoundingClientRect(), px = r.left - cr.left + x(i) * r.width / W;
    tip.style.left = Math.min(px + 12, cr.width - tip.offsetWidth - 8) + "px";
    tip.style.top = (r.top - cr.top + 10) + "px";
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
}

const root = document.getElementById("sections");
for (const sec of SECTIONS) {
  const h = document.createElement("h2"); h.className = "section-title"; h.textContent = sec.title; root.appendChild(h);
  const lg = document.createElement("div"); lg.className = "legend";
  lg.innerHTML = sec.legend.map(l => `<span><i class="sw" style="background:var(${l.color})"></i>${l.lbl}</span>`).join("");
  root.appendChild(lg);
  const grid = document.createElement("div"); grid.className = "grid"; root.appendChild(grid);
  for (const p of sec.panels) drawPanel(grid, p);
}

// table view
const DEAL_LBL = { sale: "Продажба", rent: "Наем" };
const cols = SECTIONS.flatMap(sec => sec.panels.flatMap(p => p.series));
document.getElementById("table").innerHTML = "<table><tr><th>Дата</th>" +
  cols.map(s => `<th>${DEAL_LBL[s.deal]}<br>${s.dist} ${s.cat}</th>`).join("") + "</tr>" +
  recorded.slice().reverse().map(d => `<tr><td>${fmtDate(d)}</td>` + cols.map(s => `<td>${get(d, s) ?? "–"}</td>`).join("") + "</tr>").join("") +
  "</table>";
</script>
